<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแจ้งของหาย / พบของตกหล่น - รพ.สิชล</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f1f5f9; }
        iframe { width: 100%; height: 100vh; height: 100dvh; border: none; display: block; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                   font-family: Tahoma, sans-serif; color: #64748b; }
    </style>
</head>
<body>
    <div id="loading">กำลังโหลด...</div>
    <!-- นำลิงก์ Web App (/exec) มาวางตรง src -->
    <iframe src="https://script.google.com/macros/s/AKfycbwFd9D9brT84JsrIKP2ORgll5xHF3kzje8DlA-iFW_bpGMBk_RTGMUWnzbWqGNAzTKW/exec"
            title="ระบบแจ้งของหาย รพ.สิชล"
            onload="document.getElementById('loading').style.display='none'"></iframe>
</body>
</html>
